# Conda environment specification for KARMA
name: karma
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python>=3.9
  - pip
  - pip:
    - ai2thor>=6.0.0
    - numpy>=1.24.0
    - scipy>=1.10.0
    - opencv-python>=4.8.0
    - sentence-transformers>=2.2.0
    - pyyaml>=6.0
    - requests>=2.28.0
    - openai>=1.0.0
    # Optional
    - pytest>=7.0.0
    - black>=23.0.0
    - ruff>=0.1.0
