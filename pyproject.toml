[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karma"
version = "1.0.0"
description = "Augmenting Embodied AI Agents with Long-and-short Term Memory Systems"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "KARMA Development Team"}
]
keywords = [
    "embodied-ai",
    "ai2-thor",
    "robotics",
    "llm",
    "memory-systems",
    "task-planning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
]
dependencies = [
    "ai2thor>=6.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python>=4.8.0",
    "sentence-transformers>=2.2.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "openai>=1.0.0",
    "tk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
gui = [
    "tk>=0.1.0",
]

[project.scripts]
karma = "scripts.main:main"
karma-run = "scripts.run_experiment:main"

[project.urls]
Homepage = "https://github.com/your-org/karma"
Documentation = "https://github.com/your-org/karma/docs"

[tool.setuptools.packages.find]
include = ["karma*"]

[tool.setuptools.package-dir]
"" = ""

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
